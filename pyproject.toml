[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "math-teacher-ai"
version = "1.0.0"
description = "AI Maths Teacher — Curriculum-grounded RAG backend for Class 9–10 Mathematics"
requires-python = ">=3.12"
dependencies = [
    # Core framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "alembic>=1.13.0",
    # LLM / Embeddings via Ollama (kept for easy revert)
    "ollama>=0.2.1",
    # LLM via Groq cloud API
    "groq>=0.9.0",
    # Local embeddings (replaces Ollama nomic-embed-text; 768-dim, CPU-only)
    "sentence-transformers>=3.0.0",
    # Agent orchestration
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    # Math verification
    "sympy>=1.12",
    "numpy>=1.26.0",
    # PDF ingestion
    "pypdf>=4.2.0",
    # Async HTTP
    "httpx>=0.27.0",
    # Utilities
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/math_teacher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
